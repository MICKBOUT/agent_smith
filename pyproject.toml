[project]
name = "agent-smith"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "dotenv>=0.9.9",
    "flake8>=7.4.1",
    "flake8-pyproject>=1.2.4",
    "mypy>=2.4.0",
    "openai>=3.39.0",
]

[tool.flake8]
extend-ignore = ["E501"]

[project.scripts]
sandbox = "sandbox:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["sandbox"]
