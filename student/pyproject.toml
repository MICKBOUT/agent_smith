[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-mbpp"
version = "0.1.0"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=4.1.8",
    "flake8>=7.4.1",
    "flake8-pyproject>=1.2.4",
    "mypy>=2.4.0",
    "openai>=3.39.0",
    "tiktoken>=0.9.0",
]

[project.scripts]
agent_mbpp = "agent_mbpp.__main__:main"
agent_swebench = "agent_swebench.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_mbpp", "agent_swebench", "agent_common"]